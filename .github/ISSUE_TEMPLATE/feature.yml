name: Feature request
description: Propose a general-purpose capability or integration.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      {
        label: Problem,
        description: What user or operator problem needs solving?,
      }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      {
        label: Proposed outcome,
        description: Include compatibility and privacy implications.,
      }
    validations: { required: true }
