name: Bug report
description: Report a reproducible defect using synthetic data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, screenshots, or personal data. Use a private security advisory for vulnerabilities.
  - type: input
    id: version
    attributes: { label: Version, placeholder: 0.1.0 }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes:
      { label: Reproduction, description: Minimal steps and synthetic input. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }
