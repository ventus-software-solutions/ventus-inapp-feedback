name: Deploy public showcase to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-showcase-pages.yml"
      - "apps/demo/**"
      - "packages/browser/**"
      - "packages/react/**"
      - "packages/widget/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @ventus-software-solutions/feedback-browser
      - run: npm run build --workspace @ventus-software-solutions/feedback-widget
      - run: npm run build --workspace @ventus-software-solutions/feedback-react
      - name: Build backend-free showcase
        env:
          VENTUS_SHOWCASE_BASE_PATH: /ventus-inapp-feedback/
        run: npm run build:showcase --workspace @ventus-software-solutions/feedback-demo
      - name: Prove the artifact contains no credentials or feedback endpoint
        run: node --test apps/demo/tests/static-showcase.test.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: apps/demo/dist-showcase

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
