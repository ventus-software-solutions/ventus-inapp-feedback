name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: docker compose config --quiet

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspace @ventus/feedback-contracts
      - run: npm run build --workspace @ventus/feedback-api-client
      - run: npm run build --workspace @ventus/feedback-api
      - run: docker compose up --build --wait
      - name: Smoke API
        env:
          VENTUS_SMOKE_API_URL: http://127.0.0.1:8180/v1
          VENTUS_SMOKE_PROJECT_KEY: demo-browser-key
          VENTUS_SMOKE_AGENT_TOKEN: demo-service-token
          VENTUS_SMOKE_VERIFIER_TOKEN: demo-service-token
          VENTUS_SMOKE_CONTENDER_TOKEN: demo-agent-two-token
        run: node scripts/smoke-api.mjs
      - name: Smoke retention cleanup
        env:
          VENTUS_SMOKE_API_URL: http://127.0.0.1:8180/v1
          VENTUS_SMOKE_DATABASE_URL: postgres://ventus:ventus-local-only@127.0.0.1:15433/ventus_feedback
          VENTUS_SMOKE_PROJECT_KEY: demo-browser-key
          VENTUS_SMOKE_AGENT_TOKEN: demo-service-token
          VENTUS_SMOKE_VERIFIER_TOKEN: demo-service-token
          VENTUS_SMOKE_S3_ENDPOINT: http://127.0.0.1:19001
        run: node scripts/smoke-retention.mjs
      - if: always()
        run: docker compose down
